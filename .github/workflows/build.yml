name: apk

on:
  push:
    branches: [main, master]   # keep only your actual default branch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.sh') }}
          restore-keys: |
            gradle-

      - name: Build APK + publish release
        run: bash build.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload APK artifact
        if: ${{ always() && hashFiles('Chess.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Chess-apk
          path: Chess.apk
