<style>

</style></head><body>
<div id=st></div>
<div class=ck id=c1><span></span><b></b></div>
<div id=bd></div>
<div class=ck id=c2><span></span><b></b></div>
<div id=mr><button id=pv>‹</button><div id=ml></div><button id=nx>›</button></div>
<div id=bar><button id=u>Undo</button><button id=h>Hint</button><button id=r>Restart</button><button id=fl>Flip</button><button id=m>Menu</button></div>

<div id=gl><h2>Saved games</h2><div id=gi></div><div class=g><button id=gx>Close</button></div></div>
<div id=mn data-m=ai><h1>Chess</h1>
<div class=lb>Opponent</div><div class=g data-k=mode><button data-v=ai>Computer</button><button data-v=2p>2 Players</button><button data-v=on>Online</button></div>
<div class="lb a">Difficulty</div><div class="g a" data-k=lvl><button data-v=0>Easy</button><button data-v=1>Medium</button><button data-v=2>Hard</button><button data-v=3>Expert</button></div>
<div class="lb a">Play as</div><div class="g a" data-k=side><button data-v=1>White</button><button data-v=-1>Black</button><button data-v=0>Random</button></div>
<div class=lb>Clock (minutes | increment)</div><div class=g data-k=tc><button data-v=0>Off</button><button data-v=1>3|2</button><button data-v=2>5|0</button><button data-v=3>10|0</button><button data-v=4>15|10</button></div>

<div class=g style="margin-top:6px"><input id=rc class=o maxlength=5 placeholder="CODE" autocapitalize=characters><button id=go style="background:var(--ac);color:#1d211e;font-size:18px">Start game</button></div>
<div class=g><button id=cont>Continue game</button><button id=gm>Saved games</button></div></div>
<script>
const V=[0,100,320,330,500,900,0],NO=[-33,-31,-18,-14,14,18,31,33],KD=[-17,-16,-15,-1,1,15,16,17],BD=[-17,-15,15,17],RD=[-16,-1,1,16],CM={116:3,112:2,119:1,4:12,0:8,7:4};
let b,turn,cs,ep,hm,st,ks,nodes,tEnd,stop;
function setup(){b=new Array(128).fill(0);const k=[4,2,3,5,6,3,2,4];for(let f=0;f<8;f++){b[f]=-k[f];b[16+f]=-1;b[96+f]=1;b[112+f]=k[f]}turn=1;cs=15;ep=-1;hm=0;st=[];ks=[116,4]}
function att(s,by){
 for(const q of by>0?[s+15,s+17]:[s-15,s-17])if(!(q&136)&&b[q]===by)return true;
 for(const d of NO){const q=s+d;if(!(q&136)&&b[q]===2*by)return true}
 for(const d of KD){const q=s+d;if(!(q&136)&&b[q]===6*by)return true}
 for(const d of BD){let q=s+d;while(!(q&136)){const x=b[q];if(x){if(x===3*by||x===5*by)return true;break}q+=d}}
 for(const d of RD){let q=s+d;while(!(q&136)){const x=b[q];if(x){if(x===4*by||x===5*by)return true;break}q+=d}}
 return false}
const inCheck=side=>att(ks[side>0?0:1],-side);
function gen(qs){
 const ms=[],T=turn;
 const add=(f,t,pr=0,x=0)=>ms.push({f,t,pr,x,o:(b[t]?Math.abs(b[t])*10-Math.abs(b[f]):0)+pr*8+(x===2?10:0)});
 for(let s=0;s<128;s++){
  if(s&136){s+=7;continue}
  const p=b[s];if(!p||p*T<0)continue;const t=p*T;
  if(t===1){
   const d=-16*T,r=s>>4,pro=r===(T>0?1:6);let q=s+d;
   if(!b[q]){if(pro)for(const k of[5,4,3,2])add(s,q,k);else if(!qs){add(s,q);if(r===(T>0?6:1)&&!b[q+d])add(s,q+d,0,1)}}
   for(const e of[-1,1]){q=s+d+e;if(q&136)continue;
    if(b[q]*T<0){if(pro)for(const k of[5,4,3,2])add(s,q,k);else add(s,q)}
    else if(q===ep&&!b[q])add(s,q,0,2)}
  }else if(t===2||t===6){
   for(const d of t===2?NO:KD){const q=s+d;if(q&136)continue;const x=b[q];if(x*T>0)continue;if(x||!qs)add(s,q)}
   if(t===6&&!qs&&(cs&(T>0?3:12))){const r=T>0?112:0;if(s===r+4&&!att(s,-T)){
    if((cs&(T>0?1:4))&&!b[s+1]&&!b[s+2]&&b[r+7]===4*T&&!att(s+1,-T))add(s,s+2,0,3);
    if((cs&(T>0?2:8))&&!b[s-1]&&!b[s-2]&&!b[s-3]&&b[r]===4*T&&!att(s-1,-T))add(s,s-2,0,3)}}
  }else for(const d of t===3?BD:t===4?RD:BD.concat(RD)){let q=s+d;while(!(q&136)){const x=b[q];if(x*T>0)break;if(x||!qs)add(s,q);if(x)break;q+=d}}
 }
 return ms}
function mk(m){
 const p=b[m.f],a=Math.abs(p);
 st.push({m,cs,ep,hm,c:b[m.t]});
 b[m.t]=m.pr?m.pr*turn:p;b[m.f]=0;
 if(m.x===2)b[m.t+16*turn]=0;
 if(m.x===3){const r=m.t>m.f?[m.t+1,m.t-1]:[m.t-2,m.t+1];b[r[1]]=b[r[0]];b[r[0]]=0}
 if(a===6)ks[turn>0?0:1]=m.t;
 cs&=~((CM[m.f]|0)|(CM[m.t]|0));
 ep=m.x===1?(m.f+m.t)>>1:-1;
 hm=a===1||st[st.length-1].c||m.x===2?0:hm+1;
 turn=-turn}
function um(){
 const u=st.pop(),m=u.m;turn=-turn;
 const p=b[m.t];b[m.f]=m.pr?turn:p;b[m.t]=u.c;
 if(m.x===2)b[m.t+16*turn]=-turn;
 if(m.x===3){const r=m.t>m.f?[m.t+1,m.t-1]:[m.t-2,m.t+1];b[r[0]]=b[r[1]];b[r[1]]=0}
 if(Math.abs(b[m.f])===6)ks[turn>0?0:1]=m.f;
 cs=u.cs;ep=u.ep;hm=u.hm}
function legal(){const o=[];for(const m of gen()){mk(m);if(!inCheck(-turn))o.push(m);um()}return o}
function ev(){
 let s=0,m=0;const kk=[];
 for(let q=0;q<128;q++){
  if(q&136){q+=7;continue}
  const p=b[q];if(!p)continue;
  const t=Math.abs(p),c=p>0?1:-1,f=q&7,r=q>>4,rr=c>0?7-r:r,cd=3.5-Math.max(Math.abs(f-3.5),Math.abs(r-3.5));
  let v=V[t];
  if(t===1)v+=rr*rr*2+cd*4;
  else if(t===6){kk.push([c,cd,rr]);continue}
  else{m+=V[t];v+=t===2?cd*14:t===3?cd*9:t===4?(rr===6?18:0):cd*3}
  s+=c*v}
 for(const[c,cd,rr]of kk)s+=c*(m>2600?(rr===0?25:-rr*12):cd*14);
 return s*turn}
function qs(a,bt){
 nodes++;const sc=ev();if(sc>=bt)return bt;if(sc>a)a=sc;
 for(const m of gen(1).sort((x,y)=>y.o-x.o)){mk(m);if(inCheck(-turn)){um();continue}const v=-qs(-bt,-a);um();if(v>=bt)return bt;if(v>a)a=v}
 return a}
function ab(d,a,bt,ply){
 if((++nodes&1023)===0&&Date.now()>tEnd)stop=true;
 if(stop)return 0;
 const chk=inCheck(turn);if(chk&&ply<12)d++;
 if(d<=0)return qs(a,bt);
 let n=0,best=-1e5;
 for(const m of gen().sort((x,y)=>y.o-x.o)){
  mk(m);if(inCheck(-turn)){um();continue}n++;
  const v=-ab(d-1,-bt,-a,ply+1);um();if(stop)return 0;
  if(v>best){best=v;if(v>a){a=v;if(a>=bt)break}}}
 if(!n)return chk?-30000+ply:0;
 return hm>=100?0:best}
function think(L){
 const[D,NZ,T]=[[1,450,100],[2,120,300],[4,0,900],[9,0,2500],[9,0,1200]][L];
 const root=legal().sort(()=>Math.random()-.5);if(!root.length)return null;
 tEnd=Date.now()+T;stop=false;nodes=0;let best=root[0];
 for(let d=1;d<=D;d++){
  let a=-1e5,cur=null;
  for(const m of root){
   mk(m);let v=-ab(d-1,-1e5,NZ?1e5:-a,1);um();
   if(stop)break;
   if(NZ)v+=(Math.random()-.5)*NZ;m.s=v;
   if(v>a){a=v;cur=m}}
  if(stop)break;best=cur;root.sort((x,y)=>y.s-x.s);
  if(a>29000)break}
 return best}
const $=s=>document.querySelector(s),G=['','\u265F\uFE0E','\u265E','\u265D','\u265C','\u265B','\u265A'],
TH=[['#eeeed2','#769656','#fff','#161616'],['#f0d9b5','#b58863','#fffaf0','#2b1d14'],['#dde8f0','#5f8fb4','#fff','#10202c'],['#d4d7dd','#69707e','#fff','#1b1d22']],
TC=[[0,0],[3,2],[5,0],[10,0],[15,10]],LS='chess.games',CF='chess.cfg',NT='https://ntfy.sh/chessfriends-';
let cfg={mode:'ai',lvl:1,side:1,snd:1,tc:0,th:0},ai=0,hist=[],keys=[],lg=[],chk,over,xo,last,sel=-1,tg=[],hint,busy,flip,live=0,rt=0,ac,gid,rv=null,vb,ck=[0,0],lt=0,net=null,my=1,es;
try{Object.assign(cfg,JSON.parse(localStorage[CF]))}catch(e){}
const key=()=>b.join('')+turn+cs+ep,sq=s=>'abcdefgh'[s&7]+(8-(s>>4)),
sv=()=>{try{localStorage[CF]=JSON.stringify(cfg)}catch(e){}},
ld=()=>{try{return JSON.parse(localStorage[LS]||'[]')}catch(e){return[]}},
fm=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return(ms/60|0)+':'+String(ms%60).padStart(2,'0')},
nm=c=>cfg.mode==='ai'?(c===ai?'Computer':'You'):cfg.mode==='on'?(c===my?'You':'Friend'):c>0?'White':'Black';
function skin(){const t=TH[cfg.th]||TH[0],s=document.documentElement.style;['--l','--d','--pw','--pk'].forEach((v,i)=>s.setProperty(v,t[i]))}
function beep(f,d=.07){if(!cfg.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function insuf(){let n=0;for(let s=0;s<128;s++){if(s&136){s+=7;continue}const t=Math.abs(b[s]);if(t&&t!==6){if(t===1||t===4||t===5)return false;n++}}return n<2}
function san(m){const p=b[m.f],a=Math.abs(p);if(m.x===3)return m.t>m.f?'O-O':'O-O-O';
 const cp=b[m.t]||m.x===2;let r='';
 if(a===1){if(cp)r=sq(m.f)[0]}else{r='?PNBRQK'[a];
  const o=lg.filter(x=>x.f!==m.f&&x.t===m.t&&Math.abs(b[x.f])===a);
  if(o.length)r+=o.some(x=>(x.f&7)===(m.f&7))?(o.some(x=>(x.f>>4)===(m.f>>4))?sq(m.f):sq(m.f)[1]):sq(m.f)[0]}
 return r+(cp?'x':'')+sq(m.t)+(m.pr?'='+'??NBRQ'[m.pr]:'')}
function push(m){const s=san(m);mk(m);m.s=s+(inCheck(turn)?(legal().length?'+':'#'):'');hist.push(m);keys.push(key())}
function begin(){setup();hist=[];keys=[key()];last=null;sel=-1;tg=[];hint=null;busy=false;live=1;rv=null;xo=null;over=null;gid=Date.now().toString(36);const t=TC[cfg.tc][0]*6e4;ck=[t,t];lt=Date.now()}
function newGame(){closeNet();begin();ai=cfg.mode==='ai'?-(cfg.side||(Math.random()<.5?1:-1)):0;flip=ai>0;update()}
function save(){if(!gid||net||!hist.length)return;const a=ld().filter(g=>g.id!==gid);a.unshift({id:gid,d:Date.now(),c:{mode:cfg.mode,lvl:cfg.lvl,tc:cfg.tc},ai,flip,ck,x:xo,fin:!!over,mv:hist.map(m=>[m.f,m.t,m.pr,m.x])});try{localStorage[LS]=JSON.stringify(a.slice(0,30))}catch(e){}}
function load(g){closeNet();begin();gid=g.id;cfg.mode=g.c.mode;cfg.lvl=g.c.lvl;cfg.tc=g.c.tc;ai=g.ai;flip=g.flip;xo=g.x||null;
 for(const[f,t,pr]of g.mv){lg=legal();const m=lg.find(l=>l.f===f&&l.t===t&&(l.pr|0)===pr);if(!m)break;push(m)}
 ck=g.ck;last=hist[hist.length-1]||null;lt=Date.now();update()}
function update(){
 lg=legal();chk=inCheck(turn);over=xo||null;const k=keys[keys.length-1];
 if(!over){if(!lg.length)over=chk?(turn>0?'Black':'White')+' wins by checkmate!':'Draw by stalemate';
  else if(hm>=100)over='Draw by 50-move rule';
  else if(keys.filter(x=>x===k).length>=3)over='Draw by repetition';
  else if(insuf())over='Draw: insufficient material'}
 busy=!over&&turn===ai;render();
 if(busy)setTimeout(()=>{const m=think(cfg.lvl);busy=false;if(m&&!over)play(m)},60)}
function mvs(){const e=$('#ml');let h='';hist.forEach((m,i)=>{h+=(i%2?'':'<u>'+(i/2+1)+'.</u>')+'<a data-i='+(i+1)+(i+1===(rv==null?hist.length:rv)?' class=cur':'')+'>'+m.s+'</a>'});e.innerHTML=h;const c=e.querySelector('.cur');if(c)e.scrollLeft=c.offsetLeft-e.clientWidth/2}
function drawCk(){const T=TC[cfg.tc];[['#c1',flip?1:-1],['#c2',flip?-1:1]].forEach(([q,c])=>{const e=$(q),i=c>0?0:1;e.firstChild.textContent=nm(c);e.lastChild.textContent=T[0]?fm(ck[i]):'';e.classList.toggle('on',!over&&turn===c&&rv==null);e.classList.toggle('lo',!!T[0]&&ck[i]<2e4)})}
function render(){
 const B=rv==null?b:vb,lm=rv==null?last:hist[rv-1];
 $('#st').textContent=rv!=null?'Review: move '+rv+' of '+hist.length:over||(net&&!net.ok?(net.host?'Room '+net.code+' – waiting for friend…':'Joining room '+net.code+'…'):busy?(turn===ai?'Computer is thinking…':'Thinking…'):(turn>0?'White':'Black')+' to move'+(chk?' – check!':''));
 let h='';
 for(let i=0;i<64;i++){
  const r=flip?7-(i>>3):i>>3,f=flip?7-(i&7):i&7,s=r*16+f,p=B[s],tm=rv==null&&tg.find(m=>m.t===s);
  let c='q '+((r+f)&1?'d':'l');
  if(lm&&(s===lm.f||s===lm.t))c+=' last';
  if(s===sel)c+=' sel';
  if(hint&&(s===hint.f||s===hint.t))c+=' hint';
  if(rv==null&&chk&&p===6*turn)c+=' chk';
  if(tm)c+=(p||tm.x===2)?' mv cp':' mv';
  h+=`<div class="${c}" data-s="${s}">${p?`<b class="${p>0?'pw':'pb'}">${G[Math.abs(p)]}</b>`:''}${i>>3===7?`<i class=f>${'abcdefgh'[f]}</i>`:''}${(i&7)===0?`<i class=r>${8-r}</i>`:''}</div>`}
 $('#bd').innerHTML=h;mvs();drawCk();if(!rt)$('#r').textContent=net?'Resign':'Restart';
 $('#u').disabled=busy||!hist.length||!!net||!!xo;$('#h').disabled=busy||!!over||!!net||rv!=null}
function play(m){
 rv=null;const cap=b[m.t]||m.x===2,i=turn>0?0:1,mine=net&&turn===my,T=TC[cfg.tc];
 push(m);if(T[0])ck[i]+=T[1]*1000;lt=Date.now();last=m;sel=-1;tg=[];hint=null;beep(cap?170:300);
 if(mine)netOut({k:'mv',m:hist.map(h=>[h.f,h.t,h.pr|0]),c:ck});
 update();save();if(over)beep(120,.4)}
function tap(s){
 hint=null;const ms=tg.filter(m=>m.t===s);
 if(ms.length){ms[0].pr?promo(ms):play(ms[0]);return}
 if(b[s]*turn>0&&s!==sel){sel=s;tg=lg.filter(m=>m.f===s)}else{sel=-1;tg=[]}
 render()}
function promo(ms){
 const d=$('#pm div');d.innerHTML=[5,4,3,2].map(k=>`<button data-k=${k}>${G[k]}</button>`).join('');$('#pm').classList.add('show');
 d.onclick=e=>{const k=e.target.dataset.k;if(!k)return;$('#pm').classList.remove('show');play(ms.find(m=>m.pr==k))}}
$('#pm').onclick=e=>{if(e.target.id==='pm')$('#pm').classList.remove('show')};
$('#bd').onclick=e=>{const q=e.target.closest('.q');if(!q||busy||over||!live||rv!=null||(net&&(!net.ok||turn!==my)))return;tap(+q.dataset.s)};
function goto(i){i=Math.max(0,Math.min(hist.length,i));rv=i<hist.length?i:null;sel=-1;tg=[];hint=null;
 if(rv!=null){const u=[];for(let k=hist.length-i;k>0;k--){u.push(st[st.length-1].m);um()}vb=b.slice();while(u.length)mk(u.pop())}
 render()}
const cur=()=>rv==null?hist.length:rv;
$('#pv').onclick=()=>goto(cur()-1);$('#nx').onclick=()=>goto(cur()+1);
$('#ml').onclick=e=>{const i=e.target.dataset.i;if(i)goto(+i)};
function pop(){um();hist.pop();keys.pop()}
$('#u').onclick=()=>{if(busy||!hist.length||net||xo)return;rv=null;pop();if(turn===ai&&hist.length)pop();last=hist[hist.length-1]||null;sel=-1;tg=[];hint=null;update();save()};
$('#h').onclick=()=>{if(busy||over||net||rv!=null)return;busy=true;hint=null;render();setTimeout(()=>{hint=think(4);busy=false;render()},40)};
function rst(){clearTimeout(rt);rt=0;const r=$('#r');r.textContent=net?'Resign':'Restart';r.classList.remove('on')}
$('#r').onclick=function(){if(busy)return;if(!rt){this.textContent='Sure?';this.classList.add('on');rt=setTimeout(rst,2500);return}rst();
 if(net){if(net.ok&&!over){netOut({k:'res'});xo='You resigned';update()}else{sync();mn.classList.add('show')}return}newGame()};
$('#fl').onclick=()=>{flip=!flip;render()};
/* online play through the free public ntfy.sh relay (no own server needed) */
const netOut=o=>{if(!net)return;o.me=net.me;fetch(NT+net.code,{method:'POST',body:JSON.stringify(o)}).catch(()=>{})};
function closeNet(){if(es)es.close();es=null;if(net&&net.tm)clearInterval(net.tm);net=null}
function online(c){
 const host=!c;c=c||Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
 closeNet();net={code:c,host,ok:0,me:Math.random().toString(36).slice(2,8)};cfg.mode='on';ai=0;flip=false;begin();mn.classList.remove('show');
 es=new EventSource(NT+c+'/sse');es.onmessage=e=>{try{const d=JSON.parse(JSON.parse(e.data).message);if(net&&d.me!==net.me)netIn(d)}catch(_){}};
 if(!host){const j=()=>net&&!net.ok&&netOut({k:'join'});j();net.tm=setInterval(j,2000)}
 update()}
function netIn(d){
 if(d.k==='join'&&net.host){if(!net.ok){net.ok=1;my=Math.random()<.5?1:-1;begin();flip=my<0;update()}netOut({k:'go',s:-my,t:cfg.tc})}
 else if(d.k==='go'&&!net.host&&!net.ok){net.ok=1;my=d.s;cfg.tc=d.t;begin();flip=my<0;update()}
 else if(d.k==='mv'&&net.ok){let n=0;for(const[f,t,p]of d.m.slice(hist.length)){const m=lg.find(l=>l.f===f&&l.t===t&&(l.pr|0)===p);if(!m)break;play(m);n++}if(n){ck=d.c;drawCk()}}
 else if(d.k==='res'&&net.ok&&!xo){xo='Friend resigned – you win!';update()}}
/* menu + saved games */
const mn=$('#mn'),gl=$('#gl');
function sync(){mn.dataset.m=cfg.mode;mn.querySelectorAll('.g[data-k] button').forEach(x=>x.classList.toggle('on',String(cfg[x.parentNode.dataset.k])===x.dataset.v));
 $('#go').textContent=cfg.mode==='on'?($('#rc').value.trim()?'Join room':'Create room'):'Start game';$('#cont').disabled=!(live||ld().length);$('#gm').disabled=!ld().length}
mn.onclick=e=>{const x=e.target.closest('button'),g=e.target.closest('.g[data-k]');if(x&&g){const v=x.dataset.v;cfg[g.dataset.k]=isNaN(v)?v:+v;sv();skin();sync()}};
$('#rc').oninput=sync;
$('#go').onclick=()=>{if(cfg.mode==='on')online($('#rc').value.trim().toUpperCase());else{mn.classList.remove('show');newGame()}};
$('#cont').onclick=()=>{mn.classList.remove('show');if(!live){const g=ld()[0];if(g)load(g)}};
$('#m').onclick=()=>{if(busy)return;sync();mn.classList.add('show')};
function games(){const a=ld();$('#gi').innerHTML=a.map(g=>`<div class=row><span>${g.c.mode==='ai'?'vs Computer':'2 players'} · ${Math.ceil(g.mv.length/2)} moves${g.fin?' · finished':''}<small>${new Date(g.d).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></span><button data-o="${g.id}">Open</button><button data-x="${g.id}">✕</button></div>`).join('')||'<p>No saved games yet</p>';gl.classList.add('show')}
$('#gm').onclick=games;
gl.onclick=e=>{const o=e.target.dataset.o,x=e.target.dataset.x;
 if(e.target.id==='gx')gl.classList.remove('show');
 if(o){gl.classList.remove('show');mn.classList.remove('show');load(ld().find(g=>g.id===o))}
 if(x){try{localStorage[LS]=JSON.stringify(ld().filter(g=>g.id!==x))}catch(_){}games();sync()}};
setInterval(()=>{const n=Date.now(),T=TC[cfg.tc];
 if(T[0]&&live&&!over&&hist.length&&!mn.classList.contains('show')&&!(net&&!net.ok)){const i=turn>0?0:1;ck[i]-=n-lt;
  if(ck[i]<=0){ck[i]=0;xo=(turn>0?'Black':'White')+' wins on time';over=xo;busy=false;beep(120,.4);save();render()}}
 lt=n;drawCk()},250);
skin();begin();ai=0;flip=false;update();live=0;sync();mn.classList.add('show');
</script></body></html>
