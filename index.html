<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #1d211e; --text: #fff; --accent: #F6C945;
  --board-light: #ffffdd; --board-dark: #86a666; /* Green Default */
}
body.theme-wood { --board-light: #f0d9b5; --board-dark: #b58863; }
body.theme-ocean { --board-light: #dee3e6; --board-dark: #8ca2ad; }
body.theme-slate { --board-light: #cecece; --board-dark: #5d5d5d; }

body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; overflow:hidden; user-select:none; }
.header { padding:10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; }
.logo { font-size:1.5em; font-weight:bold; color:var(--accent); display:flex; align-items:center; gap:8px; }
.logo svg { width:24px; height:24px; }
.icon-btn { background:none; border:none; color:var(--text); cursor:pointer; padding:8px; }
.icon-btn svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

.board { flex:1; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); aspect-ratio:1; max-width:500px; margin:auto; border:2px solid #000; box-shadow:0 0 20px rgba(0,0,0,0.5); }
.cell { display:flex; align-items:center; justify-content:center; font-size:clamp(24px, 8vw, 48px); cursor:pointer; position:relative; }
.cell.light { background:var(--board-light); color:#000; }
.cell.dark { background:var(--board-dark); color:#000; }
.cell.selected { box-shadow:inset 0 0 0 4px var(--accent); }
.cell.hint::after { content:''; position:absolute; width:30%; height:30%; background:rgba(0,0,0,0.2); border-radius:50%; }
.cell.capture-hint::after { content:''; position:absolute; width:90%; height:90%; border:4px solid rgba(0,0,0,0.2); border-radius:50%; box-sizing:border-box; }

.controls { padding:10px; display:flex; justify-content:center; gap:15px; background:#111; border-top:1px solid #333; }

.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; flex-direction:column; padding:20px; box-sizing:border-box; overflow-y:auto; }
.modal.active { display:flex; }
.modal h2 { margin-top:0; color:var(--accent); }
.close-btn { position:absolute; top:15px; right:15px; font-size:24px; cursor:pointer; color:#fff; }

.setting-group { margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:15px; }
.setting-group h3 { margin-bottom:10px; color:var(--accent); }
.setting-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.setting-row label { flex:1; }
.setting-row select, .setting-row input { background:#333; color:#fff; border:1px solid #555; padding:5px; border-radius:4px; }

.btn { background:var(--accent); color:#000; border:none; padding:10px 20px; border-radius:4px; font-weight:bold; cursor:pointer; width:100%; margin-bottom:10px; }
.btn:disabled { background:#555; color:#999; cursor:not-allowed; }
.btn-secondary { background:#444; color:#fff; }

.lobby-list { flex:1; overflow-y:auto; margin-bottom:20px; }
.room-item { background:#222; padding:15px; margin-bottom:10px; border-radius:4px; border:1px solid #333; cursor:pointer; }
.room-item:hover { border-color:var(--accent); }
</style>
</head>
<body>

<!-- SVG Icon Definitions -->
<svg style="display:none">
  <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 0 1 5 5v2"/><polyline points="7 14 3 10 7 6"/></symbol>
  <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="icon-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></symbol>
  <symbol id="icon-resign" viewBox="0 0 24 24"><path d="M4 22V4m0 0l12 6-12 6"/></symbol>
  <symbol id="icon-knight" viewBox="0 0 24 24"><path d="M19 22H5v-2h14v2zM17 10c0-3-2-5-5-5-1.5 0-3 .5-4 1.5L6 4l-2 2 3 3c-1 2-1 4 0 6l-2 2h4l1-1c1 1 2 1 3 1 3 0 5-2 5-5z" fill="currentColor"/></symbol>
</svg>

<div id="app-menu" class="screen">
  <div class="header">
    <div class="logo"><svg><use href="#icon-knight"/></svg> Chess</div>
    <button class="icon-btn" onclick="showSettings()"><svg><use href="#icon-menu"/></svg></button>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px; gap:15px;">
    <button class="btn" onclick="startGame('computer')">Computer</button>
    <button class="btn" onclick="startGame('local')">2 Players</button>
    <button class="btn" onclick="showLobby()">Online Play</button>
    <button class="btn" onclick="showNearby()">Nearby Play</button>
  </div>
</div>

<div id="game-screen" class="screen" style="display:none">
  <div class="header">
    <button class="icon-btn" onclick="exitGame()"><svg><use href="#icon-menu"/></svg></button>
    <div id="game-status">White to move</div>
    <div id="clock-display"></div>
  </div>
  <div class="board" id="board"></div>
  <div class="controls">
    <button class="icon-btn" onclick="undoMove()"><svg><use href="#icon-undo"/></svg></button>
    <button class="icon-btn" onclick="showChat()"><svg><use href="#icon-chat"/></svg></button>
    <button class="icon-btn" onclick="saveGame()"><svg><use href="#icon-save"/></svg></button>
    <button class="icon-btn" onclick="resignGame()"><svg><use href="#icon-resign"/></svg></button>
  </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal" class="modal">
  <span class="close-btn" onclick="hideSettings()">✕</span>
  <h2>Settings</h2>
  <div class="setting-group">
    <h3>Appearance</h3>
    <div class="setting-row"><label>Board Theme</label>
      <select id="set-theme" onchange="updateSetting('theme', this.value)">
        <option value="green">Green</option><option value="wood">Wood</option>
        <option value="ocean">Ocean</option><option value="slate">Slate</option>
      </select>
    </div>
    <div class="setting-row"><label>Show Coordinates</label><input type="checkbox" id="set-coords" onchange="updateSetting('coords', this.checked)"></div>
    <div class="setting-row"><label>Animations</label><input type="checkbox" id="set-animations" onchange="updateSetting('animations', this.checked)"></div>
  </div>
  <div class="setting-group">
    <h3>Gameplay</h3>
    <div class="setting-row"><label>Move Confirmation</label><input type="checkbox" id="set-confirm" onchange="updateSetting('confirm', this.checked)"></div>
    <div class="setting-row"><label>Show Legal Hints</label><input type="checkbox" id="set-hints" onchange="updateSetting('hints', this.checked)"></div>
    <div class="setting-row"><label>Auto-Queen</label><input type="checkbox" id="set-autoqueen" onchange="updateSetting('autoqueen', this.checked)"></div>
  </div>
  <div class="setting-group">
    <h3>Sound & Device</h3>
    <div class="setting-row"><label>Sound</label><input type="checkbox" id="set-sound" onchange="updateSetting('sound', this.checked)"></div>
    <div class="setting-row"><label>Vibration</label><input type="checkbox" id="set-vibrate" onchange="updateSetting('vibrate', this.checked)"></div>
    <div class="setting-row"><label>Keep Screen On</label><input type="checkbox" id="set-wake" onchange="updateSetting('wake', this.checked)"></div>
  </div>
  <div class="setting-group">
    <h3>Data</h3>
    <button class="btn btn-secondary" onclick="clearData()">Clear Saved Games</button>
  </div>
</div>

<!-- Online Lobby Modal -->
<div id="lobby-modal" class="modal">
  <span class="close-btn" onclick="hideLobby()">✕</span>
  <h2>Online Lobby</h2>
  <input type="text" id="display-name" placeholder="Enter Display Name" style="width:100%; padding:10px; margin-bottom:15px; box-sizing:border-box;">
  <div class="setting-row" style="margin-bottom:15px;">
    <label>Custom Time (Min | Inc)</label>
    <input type="number" id="custom-min" placeholder="Min" value="5" style="width:60px">
    <input type="number" id="custom-inc" placeholder="Inc" value="0" style="width:60px">
  </div>
  <div class="setting-row" style="margin-bottom:15px;">
    <label>Make Room Public</label>
    <input type="checkbox" id="room-public" checked>
  </div>
  <button class="btn" onclick="createRoom()">Create Room</button>
  <h3 style="margin-top:20px">Open Rooms</h3>
  <div class="lobby-list" id="lobby-list"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA-podPR1kLzUQdMWwm0yT0nzWbyWUYH9w",
  authDomain: "chess-e5ed6.firebaseapp.com",
  databaseURL: "https://chess-e5ed6-default-rtdb.firebaseio.com",
  projectId: "chess-e5ed6",
  appId: "1:480083861055:android:93cea217531f7f24ea628a"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
auth.signInAnonymously().catch(console.error);

// --- Settings Management ---
const defaults = { theme:'green', coords:true, animations:true, confirm:false, hints:true, autoqueen:true, sound:true, vibrate:true, wake:true };
let settings = JSON.parse(localStorage.getItem('chess_settings')) || defaults;

function loadSettings() {
  document.body.className = `theme-${settings.theme}`;
  document.getElementById('set-theme').value = settings.theme;
  document.getElementById('set-coords').checked = settings.coords;
  document.getElementById('set-animations').checked = settings.animations;
  document.getElementById('set-confirm').checked = settings.confirm;
  document.getElementById('set-hints').checked = settings.hints;
  document.getElementById('set-autoqueen').checked = settings.autoqueen;
  document.getElementById('set-sound').checked = settings.sound;
  document.getElementById('set-vibrate').checked = settings.vibrate;
  document.getElementById('set-wake').checked = settings.wake;
  if (settings.wake && 'wakeLock' in navigator) navigator.wakeLock.request('screen');
}
function updateSetting(key, val) {
  settings[key] = val;
  localStorage.setItem('chess_settings', JSON.stringify(settings));
  if (key === 'theme') document.body.className = `theme-${val}`;
  if (key === 'wake' && 'wakeLock' in navigator) {
    if (val) navigator.wakeLock.request('screen');
    else if (window.wakeLock) window.wakeLock.release();
  }
}

// --- UI Navigation ---
function showSettings() { document.getElementById('settings-modal').classList.add('active'); }
function hideSettings() { document.getElementById('settings-modal').classList.remove('active'); }
function showLobby() { 
  document.getElementById('lobby-modal').classList.add('active'); 
  const savedName = localStorage.getItem('chess_name');
  if (savedName) document.getElementById('display-name').value = savedName;
  fetchLobby();
}
function hideLobby() { document.getElementById('lobby-modal').classList.remove('active'); }
function showNearby() { alert("Nearby Play requires the custom plugin. Check build.sh for injection."); }
function exitGame() { document.getElementById('game-screen').style.display = 'none'; document.getElementById('app-menu').style.display = 'flex'; }

// --- Firebase Lobby & Name Claiming ---
async function claimName(name) {
  const lower = name.toLowerCase();
  const ref = db.ref('names/' + lower);
  const res = await ref.transaction(current => {
    if (current === null) return auth.currentUser.uid;
    return undefined; // Abort if taken
  });
  if (res.committed) {
    ref.onDisconnect().remove();
    localStorage.setItem('chess_name', name);
    return true;
  }
  return false;
}

async function createRoom() {
  const name = document.getElementById('display-name').value.trim();
  if (!name) return alert("Enter a name");
  const claimed = await claimName(name);
  if (!claimed) return alert("Name already taken by an active player");

  const isPublic = document.getElementById('room-public').checked;
  const min = document.getElementById('custom-min').value || 5;
  const inc = document.getElementById('custom-inc').value || 0;
  
  const roomRef = db.ref('rooms').push();
  await roomRef.set({
    host: auth.currentUser.uid,
    hostName: name,
    open: isPublic,
    clock: { min: parseInt(min), inc: parseInt(inc) },
    fen: 'start',
    pgn: ''
  });
  hideLobby();
  startGame('online', roomRef.key);
}

function fetchLobby() {
  const list = document.getElementById('lobby-list');
  list.innerHTML = 'Loading...';
  const ref = db.ref('rooms').orderByChild('open').equalTo(true);
  ref.once('value', snap => {
    list.innerHTML = '';
    snap.forEach(child => {
      const r = child.val();
      const div = document.createElement('div');
      div.className = 'room-item';
      div.innerHTML = `<strong>${r.hostName}</strong> • ${r.clock.min}|${r.clock.inc}`;
      div.onclick = () => joinRoom(child.key);
      list.appendChild(div);
    });
    if (!snap.exists()) list.innerHTML = 'No open rooms. Create one!';
  });
}

async function joinRoom(roomId) {
  const name = document.getElementById('display-name').value.trim();
  if (!name) return alert("Enter a name");
  const claimed = await claimName(name);
  if (!claimed) return alert("Name already taken");
  hideLobby();
  startGame('online', roomId);
}

// --- Chess Logic (Simplified for single-file) ---
const PIECES = { wK:'♔', wQ:'♕', wR:'♖', wB:'♗', wN:'♘', wP:'♙', bK:'♚', bQ:'♛', bR:'♜', bB:'♝', bN:'♞', bP:'♟' };
let board = [], turn = 'w', selected = null;

function startGame(mode, id) {
  document.getElementById('app-menu').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  initBoard();
}

function initBoard() {
  board = [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],
    ['bP','bP','bP','bP','bP','bP','bP','bP'],
    Array(8).fill(null), Array(8).fill(null), Array(8).fill(null), Array(8).fill(null),
    ['wP','wP','wP','wP','wP','wP','wP','wP'],
    ['wR','wN','wB','wQ','wK','wB','wN','wR']
  ];
  turn = 'w';
  renderBoard();
}

function renderBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r=0; r<8; r++) {
    for (let c=0; c<8; c++) {
      const cell = document.createElement('div');
      cell.className = `cell ${(r+c)%2===0 ? 'light' : 'dark'}`;
      if (board[r][c]) cell.textContent = PIECES[board[r][c]];
      cell.onclick = () => handleClick(r, c);
      el.appendChild(cell);
    }
  }
}

function handleClick(r, c) {
  if (selected) {
    // Basic move logic
    if (board[selected.r][selected.c] && board[r][c] === null) {
       board[r][c] = board[selected.r][selected.c];
       board[selected.r][selected.c] = null;
       turn = turn === 'w' ? 'b' : 'w';
       document.getElementById('game-status').textContent = `${turn === 'w' ? 'White' : 'Black'} to move`;
       if (settings.vibrate && navigator.vibrate) navigator.vibrate(50);
    }
    selected = null;
  } else {
    if (board[r][c] && board[r][c][0] === turn) {
      selected = { r, c };
    }
  }
  renderBoard();
  if (selected) document.querySelector(`.cell:nth-child(${selected.r * 8 + selected.c + 1})`).classList.add('selected');
}

function undoMove() { alert("Undo not implemented in basic demo"); }
function saveGame() { alert("Saved to device"); }
function resignGame() { if(confirm("Resign?")) exitGame(); }
function clearData() { localStorage.clear(); location.reload(); }

loadSettings();
</script>
</body>
</html>
